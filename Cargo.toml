[package]
name = "aprovecha"
description = "A CLI tool for decoding Provecho recipes"
version = "0.2.0"
edition = "2024"

[dependencies]
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
constcat = "0.6.1"
html5ever = "0.40.1"
minreq = { version = "3.0.0", features = ["native-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
